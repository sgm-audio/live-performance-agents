[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-performance-agents"
version = "0.1.0"
description = "Real-time agent-based system for live audio performance"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sonic Mind Forge"}
]
keywords = ["audio", "live-performance", "agents", "real-time", "dsp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "numba>=0.58.0",
    "pretty-midi>=0.2.10",
    "mido>=1.3.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sonic-mind-forge/live-performance-agents"
Documentation = "https://github.com/sonic-mind-forge/live-performance-agents/docs"
Repository = "https://github.com/sonic-mind-forge/live-performance-agents"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=core --cov=agents"
